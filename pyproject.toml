[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedresearch"
version = "0.1.0"
description = "A source-grounded research assistant for federated-learning papers"
requires-python = ">=3.11,<3.14"
dependencies = [
  "anthropic>=0.86,<1",
  "voyageai>=0.3,<1",
  "chromadb>=1.0,<2",
  "pydantic>=2.11,<3", "pymupdf>=1.26,<2", "python-dotenv>=1.1,<2",
  "pyyaml>=6,<7", "tiktoken>=0.11,<1", "typer>=0.16,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
fedresearch = "fedresearch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fedresearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
