# Fields here are merged with configs/default.yaml; this file wins on conflicts.
# Replay B3's exact merged pool using --candidate-source to isolate reranking.
indexing:
  chunk_policy: section
retrieval:
  mode: graph
  candidate_limit: 40
  graph_entities: 4
  graph_edges: 12
  graph_limit: 6
reranking:
  enabled: true
